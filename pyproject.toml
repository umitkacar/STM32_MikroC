[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stm32-biometric-ai"
version = "1.0.0"
description = "Advanced Embedded Biometric System with ML Algorithms (PCA, LDA, DCVA) on STM32 ARM Cortex-M4"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "stm32",
    "embedded",
    "biometric",
    "machine-learning",
    "pca",
    "lda",
    "dcva",
    "arm-cortex-m4",
    "tinyml",
    "edge-ai",
    "ear-recognition",
]
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "opencv-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "pyserial>=3.5",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
    "black>=23.12.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
    "ipdb>=0.13.13",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]
ml = [
    "tensorflow>=2.15.0",
    "torch>=2.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
viz = [
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "pandas>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/STM32_MikroC"
Documentation = "https://github.com/yourusername/STM32_MikroC/blob/main/docs/README.md"
Repository = "https://github.com/yourusername/STM32_MikroC"
Issues = "https://github.com/yourusername/STM32_MikroC/issues"
Changelog = "https://github.com/yourusername/STM32_MikroC/releases"

[project.scripts]
stm32-train = "stm32_biometric.cli:train"
stm32-test = "stm32_biometric.cli:test"
stm32-convert = "stm32_biometric.cli:convert"

# ==================== Hatch Configuration ====================

[tool.hatch.version]
path = "python/stm32_biometric/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/python",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["python/stm32_biometric"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
    "black>=23.12.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=stm32_biometric --cov-report=html --cov-report=term-missing {args:tests}"
test-parallel = "pytest -n auto {args:tests}"
lint = "ruff check {args:python}"
format = "black {args:python tests}"
format-check = "black --check {args:python tests}"
type-check = "mypy {args:python}"
all = [
    "format",
    "lint",
    "type-check",
    "test-cov",
]

[tool.hatch.envs.docs]
dependencies = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs docs/_build/html"
serve = "python -m http.server -d docs/_build/html 8000"

# ==================== Ruff Configuration ====================

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 100

# Source code directory
src = ["python", "tests"]

# Exclude patterns
extend-exclude = [
    ".git",
    ".hatch",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]

ignore = [
    "COM812",  # Missing trailing comma (conflicts with black)
    "ISC001",  # Single line implicit string concatenation (conflicts with black)
    "E501",    # Line too long (handled by black)
    "S101",    # Use of assert (needed for tests)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ARG001",  # Unused function argument
    "FBT001",  # Boolean positional arg
    "PLR2004", # Magic value comparison
]
"__init__.py" = [
    "F401",    # Unused import
]

[tool.ruff.lint.isort]
known-first-party = ["stm32_biometric"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==================== Black Configuration ====================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hatch
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

# ==================== MyPy Configuration ====================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "scipy.*",
    "sklearn.*",
    "serial.*",
]
ignore_missing_imports = true

# ==================== Pytest Configuration ====================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "hardware: marks tests requiring hardware connection",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==================== Coverage Configuration ====================

[tool.coverage.run]
source = ["python/stm32_biometric"]
branch = true
parallel = true
omit = [
    "tests/*",
    "*/site-packages/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ==================== Additional Tools ====================

[tool.bandit]
exclude_dirs = [
    ".git",
    ".hatch",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "tests",
]
skips = ["B101"]  # Use of assert

[tool.pyright]
include = ["python"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
