[pytest]
# Pytest configuration file
# https://docs.pytest.org/en/stable/reference/customize.html

# Minimum pytest version
minversion = 7.0

# Command line options
# Note: For coverage and parallel execution, install dev dependencies:
# pip install -e ".[dev]" or make dev
addopts =
    # Show verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Use short traceback format
    --tb=short
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config options
    --strict-config

# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast
    unit: unit tests
    integration: integration tests
    hardware: tests requiring hardware connection
    serial: tests requiring serial port
    gui: GUI-related tests
    algorithms: algorithm tests (PCA, LDA, DCVA)
    pca: PCA algorithm tests
    lda: LDA algorithm tests
    dcva: DCVA algorithm tests
    image: image processing tests
    network: tests requiring network connection
    smoke: smoke tests for quick validation

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:serial
    ignore::ResourceWarning

# Coverage configuration
[coverage:run]
source = python/stm32_biometric
branch = true
parallel = true
omit =
    tests/*
    */site-packages/*
    */__init__.py
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = Cover

exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code:
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code:
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run:
    if 0:
    if False:
    if __name__ == .__main__.:
    # Type checking
    if TYPE_CHECKING:
    # Abstract methods
    @(abc\.)?abstractmethod
    # Protocols
    class .*\bProtocol\):
    # Overload
    @overload

[coverage:html]
directory = htmlcov
title = STM32 Biometric AI Coverage Report

[coverage:xml]
output = coverage.xml
